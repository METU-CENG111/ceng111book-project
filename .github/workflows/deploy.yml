name: deploy-book

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      # FIX: Use v4 (v5 does not exist)
      - uses: actions/checkout@v4

      # FIX: Use v5 (v6 does not exist)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # 3.11 is the most stable for JB right now
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache executed notebooks
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

      # Build the book (Classic mode outputs to _build/html)
      - name: Build the book
        run: |
          jupyter-book build .

      # FIX: Point back to _build/html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
